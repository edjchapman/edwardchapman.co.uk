version: 2
updates:
  - package-ecosystem: npm # covers pnpm-lock.yaml + the packageManager field
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 (native compiler) breaks typescript-eslint; revisit when
      # typescript-eslint declares TS7 support.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
