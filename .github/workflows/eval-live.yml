name: eval-live

# Live agent evaluation (ADR-0008): calls the real model. Never part of PR
# CI — runs on demand and weekly, inside the production environment so the
# Anthropic key stays scoped. Logs and the report artifact carry case ids and
# scores only (no question or answer text) — safe on a public repository.

on:
  workflow_dispatch:
  schedule:
    # Tuesdays 08:00 UTC — offset from the Monday scheduled-check.
    - cron: "0 8 * * 2"

jobs:
  eval-live:
    name: live agent evaluation
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check key availability
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "ANTHROPIC_API_KEY is not configured — live evaluation skipped (release gate still pending; see docs/evaluation.md)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.key.outputs.present == 'true'
      - uses: pnpm/action-setup@v6
        if: steps.key.outputs.present == 'true'
      - uses: actions/setup-node@v7
        if: steps.key.outputs.present == 'true'
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        if: steps.key.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - name: Run live evaluation
        if: steps.key.outputs.present == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: claude-haiku-4-5
          JUDGE_MODEL: claude-sonnet-5
        run: make eval-agent-live
      - name: Summarise
        if: always() && steps.key.outputs.present == 'true'
        run: |
          if [ -f eval-report.json ]; then
            echo '## Live evaluation scores' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            python3 -c "import json;d=json.load(open('eval-report.json'));print(json.dumps({'scores': d['scores'], 'thresholds': d['thresholds'], 'model': d['model'], 'corpusVersion': d['corpusVersion']}, indent=2))" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload report
        if: always() && steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: eval-report
          path: eval-report.json
          retention-days: 30
