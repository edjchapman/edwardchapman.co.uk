name: deploy

# Production deploys: every push to main (i.e. every squash-merge), gated by
# the required checks that protect main and by the GitHub `production`
# environment. The gate is re-proven in-workflow so a deploy can never outrun
# a red check. Rollback: `wrangler rollback`, or re-run this workflow from the
# last good commit (docs/deployment.md).

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production # queue production deploys; never cancel one mid-flight

jobs:
  deploy:
    name: deploy production
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://edwardchapman.co.uk
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Re-prove the gate (includes the production build)
        run: make check
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --config dist/server/wrangler.json
      - name: Post-deploy smoke (real /api/ask POST)
        # The pre-merge e2e suite already exercises /api/ask against the built
        # worker, so this is a prod-only backstop (bindings, secrets). It gates
        # on the endpoint actually answering — not on sha propagation, which is
        # per-colo and can lag minutes, and would only false-fail a deploy the
        # deploy step already completed. sha visibility is logged, not gated.
        run: |
          for i in $(seq 1 18); do
            sleep 8
            health=$(curl -sS https://edwardchapman.co.uk/api/health || true)
            case "$health" in *"$GITHUB_SHA"*) sha="visible" ;; *) sha="propagating" ;; esac
            code=$(curl -sS -D ask-smoke-headers.txt -o ask-smoke.json -w '%{http_code}' \
              https://edwardchapman.co.uk/api/ask \
              -H 'content-type: application/json' \
              -d '{"question":"How did Foreman handle reliable event processing?"}' || true)
            if [ "$code" = "200" ] && grep -q '"answer"' ask-smoke.json; then
              echo "smoke ok: /api/ask answers (deployed sha $sha)"
              exit 0
            fi
            echo "attempt $i: /api/ask HTTP $code (deployed sha $sha)"
          done
          echo "post-deploy smoke failed: /api/ask did not answer within the window"
          # Surface enough of the last response to attribute edge-level blocks
          # (e.g. cf-mitigated: challenge) without rerunning from a runner.
          echo "last response headers:"
          grep -iE '^(HTTP|cf-|content-type)' ask-smoke-headers.txt || true
          echo "last response body (first 300 bytes):"
          head -c 300 ask-smoke.json || true; echo
          exit 1
      - name: Summary
        run: |
          echo "Deployed \`${GITHUB_SHA}\` — verify: \`curl https://edwardchapman.co.uk/api/health\`" >> "$GITHUB_STEP_SUMMARY"
