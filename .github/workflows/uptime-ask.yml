name: uptime-ask

# Synthetic monitor for the live model path of /api/ask. The post-deploy smoke
# in deploy.yml proves the endpoint at *deploy* time, but the Anthropic key is
# an external credential that can rot between deploys (rotation, revocation,
# expiry) with no push to re-check it — exactly how a dead key once sat silently
# in production. This probes the *public* endpoint on a schedule and fails (a
# red run is the alert; GitHub notifies on workflow failure) unless it gets a
# grounded answer: HTTP 200 with a non-empty `sources` array. A refusal
# (`"sources":[]`) or an `upstream_error` 502 both fail it — the same invariant
# the deploy smoke and the e2e round-trip assert.
#
# No external secrets: it only calls the public endpoint (which uses the
# Worker's own secret) and, on failure, opens a deduped GitHub incident issue
# via the built-in token — a red run alone was ignorable, an open issue is not.
# One live Haiku call per run — negligible cost, well within the ASK_RATE_LIMITER
# (10/60s per IP).

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch:

concurrency:
  group: uptime-ask # never overlap probes
  cancel-in-progress: false

permissions:
  contents: read # checkout (to run scripts/report-incident.sh)
  issues: write # open/close the production incident issue

jobs:
  probe:
    name: probe /api/ask (live model path)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Probe /api/ask for a grounded answer
        # A few attempts absorb a transient timeout or rate-limit so a blip
        # doesn't flap the monitor; a persistently dead key fails all of them.
        run: |
          for i in $(seq 1 3); do
            code=$(curl -sS -o ask-probe.json -w '%{http_code}' \
              https://edwardchapman.co.uk/api/ask \
              -H 'content-type: application/json' \
              -d '{"question":"How did Foreman handle reliable event processing?"}' || true)
            if [ "$code" = "200" ] && jq -e '.sources | length > 0' ask-probe.json >/dev/null 2>&1; then
              echo "ok: /api/ask returns a grounded answer (attempt $i)"
              exit 0
            fi
            echo "attempt $i: /api/ask HTTP $code, not grounded"
            sleep 20
          done
          echo "uptime-ask failed: /api/ask is not returning a grounded answer"
          echo "last response body (first 300 bytes):"
          head -c 300 ask-probe.json || true; echo
          echo "likely cause: the Worker ANTHROPIC_API_KEY is missing/rotated — see docs/deployment.md (Rotating the Anthropic API key)"
          exit 1
      - name: Open incident issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/report-incident.sh fail "uptime-ask"
      - name: Close incident issue on recovery
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/report-incident.sh ok "uptime-ask"
